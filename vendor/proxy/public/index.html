<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stremio Addon Proxy</title>
  <style>
    :root {
      --bg: #0f1220; --card: #191d33; --line: #2a2f4a;
      --fg: #e8eaf5; --muted: #9aa0c0; --accent: #7c5cff; --accent2: #38d39f;
      --danger: #ff5c7c;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #24284a, var(--bg)) no-repeat; color: var(--fg); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px; margin-bottom: 18px; }
    .card h2 { font-size: 15px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 5px; }
    input, select { width: 100%; padding: 10px 12px; background: #0d1022; color: var(--fg);
      border: 1px solid var(--line); border-radius: 9px; font-size: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 140px; }
    button { cursor: pointer; border: 0; border-radius: 9px; padding: 10px 16px; font-size: 14px;
      font-weight: 600; color: #fff; background: var(--accent); }
    button.ghost { background: #262b47; }
    button.small { padding: 6px 10px; font-size: 12px; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    .addon { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line);
      border-radius: 11px; margin-top: 10px; background: #12162a; }
    .addon-logo { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
      background: #0d1022; border: 1px solid var(--line); }
    .addon .name { font-weight: 600; }
    .addon .name input.rename { width: auto; min-width: 180px; padding: 4px 8px; margin-right: 6px;
      font-size: 13px; font-weight: 400; display: inline-block; }
    .addon .hint input.editurl { width: min(60%, 380px); padding: 4px 8px; margin: 0 6px;
      font-size: 12px; display: inline-block; }
    .addon .url { color: var(--muted); font-size: 12px; word-break: break-all; }
    .addon .actions { display: flex; gap: 8px; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: #23284a; color: var(--muted); margin-left: 8px; }
    .out { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .ok { color: var(--accent2); } .err { color: var(--danger); }
    a { color: var(--accent2); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    code { background: #0d1022; padding: 1px 6px; border-radius: 5px; font-size: 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .tile { background: #12162a; border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
    .tile .v { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .tile .v small { font-size: 13px; font-weight: 600; color: var(--muted); }
    .tile .k { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .tile.live .v { color: var(--accent2); }
    .langdd { position: relative; }
    .langtrigger { display: flex; align-items: center; gap: 6px; background: #262b47; color: var(--fg);
      border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 12px; font-weight: 500; }
    .langtrigger .caret { color: var(--muted); font-size: 10px; }
    .langmenu { position: absolute; right: 0; top: calc(100% + 4px); background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; padding: 4px; min-width: 152px; z-index: 20;
      box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .langitem { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; color: var(--fg);
      border: 0; border-radius: 7px; padding: 7px 9px; font-size: 13px; font-weight: 500; text-align: left; }
    .langitem:hover { background: #262b47; }
    .flag { display: inline-flex; width: 20px; height: 14px; border-radius: 2px; overflow: hidden; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.14); }
    .flag svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div>
        <h1>🎬 Stremio Addon Proxy</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
        <div class="langdd" id="langdd"></div>
        <button id="logout" class="ghost small" style="display:none; white-space:nowrap;" data-i18n="logout"></button>
      </div>
    </div>

    <div class="card">
      <h2><span data-i18n="stats"></span> <span class="pill" id="uptime">—</span></h2>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="card">
      <h2 data-i18n="network"></h2>
      <div class="row">
        <div style="flex:1">
          <label data-i18n="mode"></label>
          <select id="mode">
            <option value="direct" data-i18n="modeDirect"></option>
            <option value="socks" data-i18n="modeSocks"></option>
            <option value="http" data-i18n="modeHttp"></option>
          </select>
        </div>
        <div style="flex:2">
          <label data-i18n="proxyUrl"></label>
          <input id="upUrl" placeholder="socks5://127.0.0.1:40000" />
        </div>
      </div>
      <div class="hint" data-i18n-html="networkHint"></div>
      <div id="warpStatus" class="out" data-i18n="warpDetecting"></div>
      <div class="row" style="margin-top:14px">
        <button id="saveSettings" data-i18n="save"></button>
        <button id="testUp" class="ghost" data-i18n="testIp"></button>
      </div>
      <div id="settingsOut" class="out"></div>
    </div>

    <div class="card">
      <h2 data-i18n="addAddon"></h2>
      <label data-i18n="manifestUrlLabel"></label>
      <input id="manifestUrl" placeholder="https://exemple-addon.com/manifest.json" />
      <div class="hint" data-i18n-html="addHint"></div>
      <div style="margin-top:14px"><button id="addBtn" data-i18n="add"></button></div>
      <div id="addOut" class="out"></div>
    </div>

    <div class="card">
      <h2 data-i18n="proxied"></h2>
      <div id="list"></div>
    </div>
  </div>

<script src="/i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

async function refresh() {
  const s = await api('/api/state');
  $('mode').value = s.settings.upstream.mode;
  $('upUrl').value = s.settings.upstream.url || '';
  $('logout').style.display = s.authEnabled ? 'inline-block' : 'none';
  renderList(s.addons);
}

async function refreshWarpStatus() {
  const out = $('warpStatus');
  try {
    const warp = await api('/api/warp-status');
    if (!warp.detected) {
      out.textContent = I18n.t('warpNone'); out.className = 'out err';
      return;
    }
    const via = warp.mode === 'direct' ? I18n.t('warpDirect') : warp.url;
    out.textContent = `WARP : ${warp.status} · ${I18n.t('warpUse')} ${via}`; out.className = 'out ok';
  } catch (e) {
    out.textContent = I18n.t('warpFail') + ' ' + e.message; out.className = 'out err';
  }
}

$('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
};

function byteU() { return I18n.current() === 'fr' ? 'o' : 'B'; } // octet (FR) vs byte
function fmtBps(n) {
  const b = byteU();
  if (!n || n < 1) return '0<small> ' + b + '/s</small>';
  const u = ['', 'K', 'M', 'G'];
  const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + '<small> ' + u[i] + b + '/s</small>';
}
function fmtMem(n) {
  const b = byteU();
  if (!n) return '0<small> M' + b + '</small>';
  const mo = n / (1024 * 1024);
  return (mo >= 1024 ? (mo / 1024).toFixed(2) + '<small> G' + b + '</small>' : mo.toFixed(0) + '<small> M' + b + '</small>');
}
function fmtUptime(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  if (d) return `${d}${I18n.t('dayU')} ${h}${I18n.t('hourU')}`;
  if (h) return `${h}${I18n.t('hourU')} ${m}${I18n.t('minU')}`;
  return `${m}${I18n.t('minU')}`;
}
async function refreshStats() {
  let st;
  try { st = await api('/api/stats'); } catch { return; }
  $('uptime').textContent = I18n.t('uptime') + ' ' + fmtUptime(st.uptimeSec);
  const tiles = [
    { k: I18n.t('bandwidth'), v: fmtBps(st.bandwidthBps), html: true, live: true },
    { k: 'CPU', v: (st.cpuPercent ?? 0).toFixed(1) + '<small> %</small>', html: true },
    { k: 'RAM', v: fmtMem(st.rssBytes), html: true }
  ];
  $('tiles').innerHTML = tiles.map((t) =>
    `<div class="tile${t.live ? ' live' : ''}"><div class="v">${t.html ? t.v : escapeHtml(String(t.v))}</div><div class="k">${t.k}</div></div>`
  ).join('');
}

function renderList(addons) {
  const el = $('list');
  if (!addons.length) { el.innerHTML = `<p class="hint">${escapeHtml(I18n.t('noAddons'))}</p>`; return; }
  el.innerHTML = '';
  for (const a of addons) {
    const stremioLink = a.installUrl.replace(/^https?:\/\//, 'stremio://');
    const div = document.createElement('div');
    div.className = 'addon';
    const display = a.displayName || a.name;
    div.innerHTML = `
      ${a.logo ? `<img class="addon-logo" src="${escapeHtml(a.logo)}" alt="" onerror="this.remove()" />` : ''}
      <div style="flex:1; min-width:0">
        <div class="name">${escapeHtml(display)}</div>
        <div class="hint" style="margin-top:0">${escapeHtml(I18n.t('origin'))} ${escapeHtml(a.name)}</div>
        <div class="url">${escapeHtml(a.installUrl)}</div>
      </div>
      <div class="actions">
        <a href="${stremioLink}"><button class="small">${escapeHtml(I18n.t('install'))}</button></a>
        <button class="small ghost" data-copy="${encodeURIComponent(a.installUrl)}">${escapeHtml(I18n.t('copy'))}</button>
        <button class="small ghost" data-rename="${a.id}" data-current="${encodeURIComponent(display)}">${escapeHtml(I18n.t('rename'))}</button>
        <button class="small ghost" data-edit="${a.id}" data-url="${encodeURIComponent(a.manifestUrl || '')}">${escapeHtml(I18n.t('edit'))}</button>
        <button class="small danger" data-del="${a.id}">${escapeHtml(I18n.t('del'))}</button>
      </div>`;
    el.appendChild(div);
  }
  el.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    await api('/api/addons/' + b.dataset.del, { method: 'DELETE' });
    refresh();
  });
  el.querySelectorAll('[data-rename]').forEach((b) => b.onclick = () => {
    const id = b.dataset.rename;
    const nameDiv = b.closest('.addon').querySelector('.name');
    const current = decodeURIComponent(b.dataset.current);
    nameDiv.innerHTML = `<input class="rename" value="${escapeHtml(current)}" />`
      + `<button class="small" data-save>✓</button>`
      + `<button class="small ghost" data-cancel>✗</button>`;
    const input = nameDiv.querySelector('input');
    input.focus(); input.select();
    const save = async () => {
      const val = input.value.trim();
      if (!val) return;
      try {
        await api('/api/addons/' + id, { method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName: val }) });
        refresh();
      } catch (e) { alert(e.message); }
    };
    nameDiv.querySelector('[data-save]').onclick = save;
    nameDiv.querySelector('[data-cancel]').onclick = () => refresh();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') refresh();
    });
  });
  el.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => {
    const id = b.dataset.edit;
    const hintDiv = b.closest('.addon').querySelector('.hint');
    const current = decodeURIComponent(b.dataset.url);
    hintDiv.innerHTML = `${escapeHtml(I18n.t('sourceUrl'))} <input class="editurl" value="${escapeHtml(current)}" />`
      + `<button class="small" data-saveurl>✓</button>`
      + `<button class="small ghost" data-cancelurl>✗</button>`;
    const input = hintDiv.querySelector('input');
    input.focus(); input.select();
    const save = async () => {
      const val = input.value.trim();
      if (!val) return;
      const btn = hintDiv.querySelector('[data-saveurl]');
      btn.disabled = true; btn.textContent = '…'; // validation réseau
      try {
        await api('/api/addons/' + id, { method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ manifestUrl: val }) });
        refresh();
      } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = '✓'; }
    };
    hintDiv.querySelector('[data-saveurl]').onclick = save;
    hintDiv.querySelector('[data-cancelurl]').onclick = () => refresh();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') refresh();
    });
  });
  el.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => {
    await navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy));
    b.textContent = I18n.t('copied'); setTimeout(() => b.textContent = I18n.t('copy'), 1200);
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('addBtn').onclick = async () => {
  const out = $('addOut'); out.textContent = I18n.t('checking'); out.className = 'out';
  try {
    await api('/api/addons', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ manifestUrl: $('manifestUrl').value }) });
    $('manifestUrl').value = '';
    out.textContent = I18n.t('addedOk'); out.className = 'out ok';
    refresh();
  } catch (e) { out.textContent = e.message; out.className = 'out err'; }
};

$('saveSettings').onclick = async () => {
  const out = $('settingsOut'); out.textContent = I18n.t('saving'); out.className = 'out';
  try {
    await api('/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ upstream: { mode: $('mode').value, url: $('upUrl').value } }) });
    out.textContent = I18n.t('savedOk'); out.className = 'out ok';
    refreshWarpStatus();
  } catch (e) { out.textContent = e.message; out.className = 'out err'; }
};

$('testUp').onclick = async () => {
  const out = $('settingsOut'); out.textContent = I18n.t('testing'); out.className = 'out';
  try {
    const r = await api('/api/test-upstream', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ upstream: { mode: $('mode').value, url: $('upUrl').value } }) });
    out.textContent = `${I18n.t('exitIp')} (${r.mode}) : ${r.ip}`; out.className = 'out ok';
  } catch (e) { out.textContent = I18n.t('failed') + ' ' + e.message; out.className = 'out err'; }
};

// --- Sélecteur de langue avec drapeaux SVG (menu personnalisé) ---
const LANG_NAMES = { fr: 'Français', en: 'English', es: 'Español', de: 'Deutsch', it: 'Italiano' };
const FLAGS = {
  fr: `<svg viewBox='0 0 30 20'><rect width='10' height='20' fill='#0055A4'/><rect x='10' width='10' height='20' fill='#fff'/><rect x='20' width='10' height='20' fill='#EF4135'/></svg>`,
  en: `<svg viewBox='0 0 30 20'><rect width='30' height='20' fill='#012169'/><path d='M0,0 30,20 M30,0 0,20' stroke='#fff' stroke-width='4'/><path d='M0,0 30,20 M30,0 0,20' stroke='#C8102E' stroke-width='2'/><rect x='12' width='6' height='20' fill='#fff'/><rect y='7' width='30' height='6' fill='#fff'/><rect x='13.5' width='3' height='20' fill='#C8102E'/><rect y='8.5' width='30' height='3' fill='#C8102E'/></svg>`,
  es: `<svg viewBox='0 0 30 20'><rect width='30' height='20' fill='#AA151B'/><rect y='5' width='30' height='10' fill='#F1BF00'/></svg>`,
  de: `<svg viewBox='0 0 30 20'><rect width='30' height='6.67' fill='#000'/><rect y='6.67' width='30' height='6.67' fill='#D00'/><rect y='13.34' width='30' height='6.66' fill='#FFCE00'/></svg>`,
  it: `<svg viewBox='0 0 30 20'><rect width='10' height='20' fill='#009246'/><rect x='10' width='10' height='20' fill='#fff'/><rect x='20' width='10' height='20' fill='#CE2B37'/></svg>`
};
function buildLangDropdown() {
  const dd = $('langdd');
  dd.innerHTML = `<button type="button" class="langtrigger" id="langtrigger" aria-haspopup="true" aria-expanded="false"></button>`
    + `<div class="langmenu" id="langmenu" hidden>`
    + I18n.SUPPORTED.map((c) => `<button type="button" class="langitem" data-lang="${c}"><span class="flag">${FLAGS[c]}</span><span>${LANG_NAMES[c]}</span></button>`).join('')
    + `</div>`;
  const trigger = $('langtrigger'), menu = $('langmenu');
  const paint = () => {
    const c = I18n.current();
    trigger.innerHTML = `<span class="flag">${FLAGS[c]}</span><span>${LANG_NAMES[c]}</span><span class="caret">▾</span>`;
  };
  paint();
  trigger.onclick = (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    trigger.setAttribute('aria-expanded', String(!menu.hidden));
  };
  menu.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
    I18n.set(b.dataset.lang);
    paint(); menu.hidden = true; trigger.setAttribute('aria-expanded', 'false');
    refresh(); refreshStats(); refreshWarpStatus();
  });
  document.addEventListener('click', () => {
    if (!menu.hidden) { menu.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
  });
}

I18n.apply();
buildLangDropdown();

refresh();
refreshWarpStatus();
refreshStats();
setInterval(refreshStats, 2000);
</script>
</body>
</html>
