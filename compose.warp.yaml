name: nuvio-manager

services:
  manager:
    image: ghcr.io/guiro28/nuvio-manager:latest
    container_name: nuvio-manager
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-moi-12-caracteres-minimum
      # PUBLIC_URL: https://manager.example.com    # Adresse publique HTTPS du dashboard.
      # DISABLE_LOGIN: "true"                      # Désactiver la page de connexion du manager (UNIQUEMENT derrière une authentification externe type OAuth : sinon l'accès est ouvert en admin).
      # AUTH_PROXY: "true"                         # Faire confiance à l'identité injectée par un proxy d'auth (X-Auth-Request-User/X-Forwarded-User). Voir docs/oauth2-proxy.md.
      # TRUST_PROXY_IPS: "172.16.0.0/12"           # IPs/CIDR autorisés à poser les en-têtes X-Forwarded-*/X-Auth-Request-* (défaut : boucle locale + réseau privé).
      # SESSION_SAMESITE: lax                      # lax (défaut) | strict | none — attribut SameSite du cookie de session.
      # SESSION_DOMAIN: .example.com               # Domaine optionnel du cookie de session.
      # RELAY_PORT: "3101"                         # Écouteur additionnel servant uniquement le relais public /relay/** (hors proxy d'auth).
    volumes:
      - manager-data:/app/data
  warp:
    image: caomingjun/warp:latest
    container_name: nuvio-manager-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WARP_SLEEP: 2
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS --max-time 8 --socks5 localhost:1080 https://cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)'"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  manager-data:
  warp-data:
