name: nuvio-manager

services:
  manager:
    image: ghcr.io/guiro28/nuvio-manager:latest
    container_name: nuvio-manager
    restart: unless-stopped
    ports:
      - "3100:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - manager-data:/app/data
  warp:
    image: caomingjun/warp:latest
    container_name: nuvio-manager-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WARP_SLEEP: 2
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS --max-time 8 --socks5 localhost:1080 https://cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)'"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  manager-data:
  warp-data:
