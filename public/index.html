<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nuvio Manager</title>
    <meta
      name="description"
      content="Gérez vos profils Nuvio, vos addons et vos paramètres TV et Mobile."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/aurora.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <div class="shell">
      <aside>
        <a class="brand" href="/"
          ><img class="brand-logo" src="/assets/nuvio-manager-logo.png" alt="" width="52" height="52"
          ><span>nuvio<span class="brand-sub">MANAGER</span></span></a
        >
        <nav id="nav">
          <button data-page="home" class="active">
            <span>⌂</span> <span class="nav-label">Accueil</span></button
          ><button data-page="profiles">
            <span>▦</span> <span class="nav-label">Comptes & profils</span></button
          ><button data-page="statistics"><span>▥</span> <span class="nav-label">Statistiques</span></button
          ><button data-page="library">
            <span>⊞</span> <span class="nav-label">Bibliothèque d’addons</span></button
          ><button data-page="copy"><span>⇄</span> <span class="nav-label">Cloner un profil</span></button
          ><button data-page="proxy"><span>⇢</span> <span class="nav-label">Proxy</span></button
          ><button data-page="backups"><span>↶</span> <span class="nav-label">Sauvegardes</span></button>
          <button data-page="settings"><span>⚙</span> <span class="nav-label">Paramètres</span></button>
        </nav>
      </aside>
      <main>
        <header>
          <div class="breadcrumb">
            <span id="crumb-root">Espace personnel</span> <span>/</span>
            <span id="crumb">Comptes & profils</span>
          </div>
          <div class="header-actions"><details id="lang-menu" class="lang-menu"><summary aria-label="Langue"><span class="lang-flag" id="lang-current-flag"></span><span id="lang-current-name" class="lang-current-name"></span><span class="lang-caret" aria-hidden="true">⌄</span></summary><div class="lang-list" id="lang-list" role="listbox"></div></details><button id="theme-toggle" type="button" aria-label="Passer en mode clair">☀ Mode clair</button><button id="logout" class="quiet">Déconnexion</button></div>
        </header>
        <div id="content" aria-live="polite">
          <p>Chargement du dashboard…</p>
        </div>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog"></dialog>
  </body>
</html>
