name: nuvio-manager
services:
  manager:
    image: ghcr.io/guiro28/nuvio-manager:latest
    container_name: nuvio-manager
    restart: unless-stopped
    ports:
      - "3100:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - manager-data:/app/data
volumes:
  manager-data:
